name: "Release Staging Collector Lambda layer"

on:
  # (Using tag push instead of release to allow filtering by tag prefix.)
  push:
    tags:
      - layer-staging-collector/**

permissions:
  contents: read

jobs:
  build-layer:
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        architecture:
          - amd64
          - arm64
    outputs:
      component-version: ${{ steps.build.outputs.component-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/build-collector-layer
        id: build
        with:
          architecture: ${{ matrix.architecture }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentelemetry-collector-layer-${{ matrix.architecture == 'amd64' && 'x86_64' || 'arm64' }}.zip
          path: ${{ steps.build.outputs.artifact-path }}

  scan:
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/reversinglabs.yml
    needs: build-layer
    strategy:
      matrix:
        architecture:
          - amd64
          - arm64
    with:
      artifact-name: opentelemetry-collector-layer-${{ matrix.architecture == 'amd64' && 'x86_64' || 'arm64' }}.zip
    secrets: inherit

  publish-layer:
    permissions: # required by the reusable workflow
      contents: read
      id-token: write
    uses: $/.github/workflows/layer-publish.yml
    needs: build-layer
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - amd64
          - arm64
        aws_region:
          - af-south-1
          - ap-east-1
          - ap-east-2
          - ap-northeast-1
          - ap-northeast-2
          - ap-south-1
          - ap-south-2
          - ap-southeast-1
          - ap-southeast-2
          - ap-southeast-3
          - ap-southeast-4
          - ap-southeast-5
          - ap-southeast-6
          - ap-southeast-7
          - ca-central-1
          - ca-west-1
          - eu-central-1
          - eu-central-2
          - eu-north-1
          - eu-south-1
          - eu-south-2
          - eu-west-1
          - eu-west-2
          - eu-west-3
          - il-central-1
          - me-central-1
          - mx-central-1
          - sa-east-1
          - us-east-1
          - us-east-2
          - us-west-1
          - us-west-2
    with:
      artifact-name: opentelemetry-collector-layer-${{ matrix.architecture == 'amd64' && 'x86_64' || 'arm64' }}.zip
      layer-name: opentelemetry-collector
      component-version: ${{ needs.build-layer.outputs.component-version }}
      architecture: ${{ matrix.architecture }}
      release-group: staging
      aws_region: ${{ matrix.aws_region }}
    secrets: inherit
