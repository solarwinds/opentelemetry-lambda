name: 'Build Collector Lambda Layer'
description: 'Builds the OpenTelemetry Collector Lambda layer for the given architecture'

inputs:
  architecture:
    description: 'Target architecture (amd64 or arm64)'
    required: false
    default: amd64

outputs:
  artifact-path:
    description: 'Absolute path to the built layer zip'
    value: ${{ github.workspace }}/collector/build/opentelemetry-collector-layer-${{ inputs.architecture == 'amd64' && 'x86_64' || 'arm64' }}.zip
  component-version:
    description: 'Collector binary version. Only set when architecture is amd64.'
    value: ${{ steps.version.outputs.component-version }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: collector/go.mod

    - name: set version to the default config.yaml
      shell: bash
      run: |
        version=$(echo ${REF_NAME} | awk -F'/' {'print $2'})
        sed -i "s/0.0.0-dev/$version/g" collector/config.yaml
      env:
        REF_NAME: ${{ github.ref_name }}

    - name: cat collector/config.yaml
      shell: bash
      run: cat collector/config.yaml

    - name: Build collector layer
      shell: bash
      run: make -C collector package GOARCH="${INPUTS_ARCHITECTURE}"
      env:
        INPUTS_ARCHITECTURE: ${{ inputs.architecture }}

    - name: Save collector version
      if: ${{ inputs.architecture == 'amd64' }}
      id: version
      shell: bash
      run: |
        COMPONENT_VERSION=$(${{ github.workspace }}/collector/build/extensions/collector -v)
        echo "component-version=$COMPONENT_VERSION" >> "$GITHUB_OUTPUT"
